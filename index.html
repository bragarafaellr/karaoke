<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaokê</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: #0d0b14; color: #f2eef8;
    font: 16px/1.5 system-ui, -apple-system, sans-serif;
    max-width: 900px; margin-inline: auto;
  }
  h1 { font-size: 20px; margin: 0 0 16px; letter-spacing: -0.02em; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em;
       color: #8b82a8; margin: 24px 0 8px; }
  #stage { position: relative; padding-top: 56.25%; background: #000;
           border-radius: 12px; overflow: hidden; }
  #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
  #score {
    position: absolute; inset: 0; z-index: 2; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: #0d0b14ee; text-align: center; gap: 4px; padding: 16px;
  }
  #score.on { display: flex; }
  #score .n { font-size: 72px; font-weight: 800; letter-spacing: -0.04em; color: #7c5cff; line-height: 1; }
  #score .m { font-size: 18px; font-weight: 600; margin-top: 8px; }
  #score .s { font-size: 13px; color: #6b6484; }
  #allVotes {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    margin-top: 14px; max-width: 90%;
  }
  #allVotes span {
    font-size: 13px; padding: 4px 10px; border-radius: 999px;
    background: #241f38; color: #b9b0d4;
  }
  #allVotes b { color: #f2eef8; font-variant-numeric: tabular-nums; }
  #tvcard {
    position: absolute; inset: 0; z-index: 1; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: #161320; text-align: center; padding: 24px; gap: 8px;
  }
  #tvcard.on { display: flex; }
  #tvcard .lbl { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #8b82a8; }
  #tvcard .t { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  #now { margin: 12px 0; font-size: 18px; font-weight: 600; min-height: 27px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  input {
    flex: 1; min-width: 0; padding: 12px; border-radius: 10px;
    border: 1px solid #2c2740; background: #16132099; color: inherit; font: inherit;
  }
  input:focus { outline: 2px solid #7c5cff; border-color: transparent; }
  button {
    padding: 12px 16px; border: 0; border-radius: 10px;
    background: #7c5cff; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #6b4aef; }
  button.ghost { background: #241f38; color: #b9b0d4; padding: 8px 12px; font-weight: 400; }
  #votes { color: #8b82a8; font-size: 14px; }
  #qrbox {
    display: flex; gap: 12px; align-items: center; padding: 12px;
    background: #16132099; border-radius: 12px; margin-top: 12px;
  }
  #qrbox canvas { border-radius: 6px; background: #fff; }
  #qrbox .info { font-size: 13px; color: #8b82a8; min-width: 0; }
  #qrbox .code { font-size: 28px; font-weight: 800; color: #f2eef8; letter-spacing: 0.1em; }
  ul, ol { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 12px; padding: 8px;
    border-radius: 10px; background: #16132099; margin-bottom: 6px;
  }
  li img { width: 80px; border-radius: 6px; flex-shrink: 0; }
  li .t { flex: 1; min-width: 0; font-size: 14px; }
  ol { counter-reset: n; }
  ol li::before {
    counter-increment: n; content: counter(n);
    color: #8b82a8; font-variant-numeric: tabular-nums; min-width: 20px;
  }
  .empty { color: #6b6484; font-size: 14px; }
</style>

<h1>🎤 Karaokê</h1>

<div id="stage">
  <div id="player"></div>
  <div id="score">
    <div class="n"></div>
    <div class="m"></div>
    <div class="s"></div>
    <div id="allVotes"></div>
    <button id="nextBtn" style="margin-top:16px">Próxima ▶</button>
  </div>
  <div id="tvcard">
    <div class="lbl">Cantando agora</div>
    <div class="t" id="tvTitle"></div>
  </div>
</div>
<div id="now"></div>
<div class="row">
  <button class="ghost" id="modeBtn">📺 Usar TV externa</button>
  <button class="ghost" id="skipBtn">Pular ⏭</button>
  <span id="votes"></span>
</div>

<div id="qrbox">
  <canvas id="qr"></canvas>
  <div class="info">
    Escaneie para dar nota<br>
    <span class="code" id="code"></span><br>
    <span id="voteUrl"></span>
  </div>
</div>

<h2>Buscar</h2>
<div class="row">
  <input id="q" placeholder="ex: evidências karaokê — ou cole um link do YouTube">
  <button id="goBtn">Buscar</button>
</div>
<div class="row">
  <input id="pl" placeholder="Cole a URL de uma playlist do YouTube">
  <button id="plBtn">Importar</button>
</div>

<h2>Fila</h2>
<ol id="queue"></ol>
<p id="queueEmpty" class="empty">Vazia. Busque uma música acima.</p>

<h2>Resultados</h2>
<ul id="results"></ul>

<script src="https://www.youtube.com/iframe_api"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAW3sSLIZmfip5mBZRsy4NfZ_gv9hA7WKs",
  authDomain: "karaoke-mp31.firebaseapp.com",
  databaseURL: "https://karaoke-mp31-default-rtdb.firebaseio.com",
  projectId: "karaoke-mp31"
};

const db = getDatabase(initializeApp(firebaseConfig));

const code = Math.random().toString(36).slice(2, 6).toUpperCase();
const voteUrl = location.href.replace(/[^/]*$/, '') + 'vote.html?s=' + code;
document.getElementById('code').textContent = code;
document.getElementById('voteUrl').textContent = voteUrl.replace(/^https?:\/\//, '');
(async () => {
  try {
    const QRCode = (await import('https://cdn.jsdelivr.net/npm/qrcode@1.5.3/+esm')).default;
    await QRCode.toCanvas(document.getElementById('qr'), voteUrl, { width: 120, margin: 1 });
  } catch (e) {
    document.getElementById('qr').remove();
    console.error('QR falhou, use o link abaixo:', e);
  }
})();

let player, queue = [], current = null, scoreTimer = null;
let songKey = null, stopVotes = null, votes = {};

let pending = false;

function initPlayer() {
  player = new YT.Player('player', {
    playerVars: { playsinline: 1 },
    events: {
      onReady: () => { if (pending) { pending = false; player.loadVideoById(current.id); } },
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) showScore(); }
    }
  });
}

if (window.YT && window.YT.Player) initPlayer();
else window.onYouTubeIframeAPIReady = initPlayer;

const YT_KEY = 'AIzaSyA4gvuREQP7LIDijMceoh2914qh39cTkNQ';

function videoId(url) {
  const m = url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : (/^[\w-]{11}$/.test(url.trim()) ? url.trim() : null);
}

async function go() {
  const raw = document.getElementById('q').value.trim();
  if (!raw) return;
  const id = videoId(raw);
  if (id) {
    add({ id, title: 'Vídeo ' + id, thumb: `https://i.ytimg.com/vi/${id}/mqdefault.jpg` });
    document.getElementById('q').value = '';
    return;
  }
  const url = 'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=10'
    + '&videoEmbeddable=true&q=' + encodeURIComponent(raw + ' karaoke') + '&key=' + YT_KEY;
  try {
    const r = await fetch(url);
    const d = await r.json();
    if (d.error) throw new Error(d.error.message);
    render(d.items.map(i => ({
      id: i.id.videoId, title: i.snippet.title, thumb: i.snippet.thumbnails.medium.url
    })));
  } catch (err) {
    alert('Erro na busca: ' + err.message);
  }
}

async function importPlaylist() {
  const raw = document.getElementById('pl').value.trim();
  const m = raw.match(/[?&]list=([\w-]+)/) || raw.match(/^([\w-]{13,})$/);
  if (!m) { alert('Cole a URL de uma playlist (precisa conter "list=").'); return; }

  const btn = document.getElementById('plBtn');
  btn.disabled = true;
  btn.textContent = '...';
  let token = '', total = 0;
  try {
    do {
      const url = 'https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50'
        + '&playlistId=' + m[1] + '&key=' + YT_KEY + (token ? '&pageToken=' + token : '');
      const d = await (await fetch(url)).json();
      if (d.error) throw new Error(d.error.message);
      d.items.forEach(i => {
        const id = i.snippet.resourceId && i.snippet.resourceId.videoId;
        if (!id || i.snippet.title === 'Deleted video') return;
        queue.push({ id, title: i.snippet.title, thumb: `https://i.ytimg.com/vi/${id}/mqdefault.jpg` });
        total++;
      });
      token = d.nextPageToken || '';
    } while (token);
    document.getElementById('pl').value = '';
    drawQueue();
    if (!current) next();
    alert(total + ' música(s) adicionada(s) à fila.');
  } catch (err) {
    alert('Erro ao importar: ' + err.message + '\n\nA playlist precisa ser pública ou não listada.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Importar';
  }
}

function render(items) {
  const ul = document.getElementById('results');
  ul.innerHTML = '';
  items.forEach(v => {
    const li = document.createElement('li');
    li.innerHTML = `<img src="${v.thumb}"><span class="t"></span>`;
    li.querySelector('.t').textContent = v.title;
    const b = document.createElement('button');
    b.className = 'ghost';
    b.textContent = '+ Fila';
    b.onclick = () => add(v);
    li.append(b);
    ul.append(li);
  });
}

function add(v) {
  queue.push(v);
  drawQueue();
  if (!current) next();
}

function drawQueue() {
  const ol = document.getElementById('queue');
  ol.innerHTML = '';
  queue.forEach((v, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<img src="${v.thumb}"><span class="t"></span>`;
    li.querySelector('.t').textContent = v.title;
    const b = document.createElement('button');
    b.className = 'ghost';
    b.textContent = '✕';
    b.onclick = () => { queue.splice(i, 1); drawQueue(); };
    li.append(b);
    ol.append(li);
  });
  document.getElementById('queueEmpty').hidden = queue.length > 0;
}

function showScore() {
  const list = Object.values(votes).map(v => v.score);
  const avg = list.length ? Math.round(list.reduce((a, b) => a + b, 0) / list.length) : 50;
  const delta = Math.round(Math.random() * 50 - 25);
  const final = Math.max(0, Math.min(100, avg + delta));
  const msg = final >= 95 ? 'Perfeito! 🏆' : final >= 85 ? 'Mandou muito! 🎉'
            : final >= 70 ? 'Boa! 👏' : final >= 45 ? 'Passou 😌' : 'Vai melhorar 😅';

  const sub = list.length
    ? `público: ${avg} (${list.length} voto${list.length > 1 ? 's' : ''}) · júri técnico: ${delta >= 0 ? '+' : ''}${delta}`
    : `ninguém votou · júri técnico decidiu sozinho`;

  const el = document.getElementById('score');
  el.querySelector('.n').textContent = final;
  el.querySelector('.m').textContent = msg;
  el.querySelector('.s').textContent = sub;

  const box = document.getElementById('allVotes');
  box.innerHTML = '';
  Object.values(votes)
    .sort((a, b) => b.score - a.score)
    .forEach(v => {
      const s = document.createElement('span');
      s.textContent = (v.nick || 'anônimo') + ' ';
      const b = document.createElement('b');
      b.textContent = v.score;
      s.append(b);
      box.append(s);
    });

  el.classList.add('on');

  let t = 10;
  scoreTimer = setInterval(() => { if (--t <= 0) next(); }, 1000);
}

function next() {
  clearInterval(scoreTimer);
  document.getElementById('score').classList.remove('on');

  if (stopVotes) { stopVotes(); stopVotes = null; }
  votes = {};
  document.getElementById('votes').textContent = '';

  current = queue.shift() || null;
  drawQueue();
  document.getElementById('now').textContent = current ? '▶ ' + current.title : '';

  if (!current) {
    songKey = null;
    set(ref(db, `sessions/${code}/current`), null);
    document.getElementById('tvTitle').textContent = '—';
    if (player) player.stopVideo();
    return;
  }

  document.getElementById('tvTitle').textContent = current.title;
  songKey = 's' + Date.now();
  set(ref(db, `sessions/${code}/current`), {
    videoId: current.id, title: current.title, songKey
  });
  stopVotes = onValue(ref(db, `sessions/${code}/votes/${songKey}`), snap => {
    votes = snap.val() || {};
    const n = Object.keys(votes).length;
    document.getElementById('votes').textContent = n ? `${n} nota${n > 1 ? 's' : ''} recebida${n > 1 ? 's' : ''}` : '';
  });
  if (tvMode) { if (player) player.stopVideo(); return; }
  if (player && player.loadVideoById) player.loadVideoById(current.id);
  else pending = true;
}

let tvMode = false;

function setMode(tv) {
  tvMode = tv;
  document.getElementById('tvcard').classList.toggle('on', tv);
  document.getElementById('modeBtn').textContent = tv ? '▶️ Usar player embutido' : '📺 Usar TV externa';
  document.getElementById('skipBtn').textContent = tv ? 'Encerrar → nota' : 'Pular ⏭';
  if (tv && player) player.stopVideo();
  else if (!tv && current && player && player.loadVideoById) player.loadVideoById(current.id);
}

document.getElementById('goBtn').onclick = go;
document.getElementById('plBtn').onclick = importPlaylist;
document.getElementById('modeBtn').onclick = () => setMode(!tvMode);
document.getElementById('nextBtn').onclick = next;
document.getElementById('skipBtn').onclick = () => {
  if (document.getElementById('score').classList.contains('on')) next();
  else showScore();
};
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
document.getElementById('pl').addEventListener('keydown', e => { if (e.key === 'Enter') importPlaylist(); });
</script>
